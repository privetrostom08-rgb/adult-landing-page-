<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel</title>
    <style>
        body { font-family: Arial, sans-serif; background: #eef2f3; margin: 0; padding: 20px; }
        .admin-container { max-width: 700px; margin: auto; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .section { margin-bottom: 25px; padding-bottom: 15px; border-bottom: 1px solid #ddd; }
        input, textarea, button { width: 100%; padding: 10px; margin-top: 8px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background: #28a745; color: white; border: none; font-weight: bold; cursor: pointer; }
        button:hover { background: #218838; }
        .image-item { display: flex; align-items: center; justify-content: space-between; background: #f9f9f9; padding: 10px; margin-bottom: 8px; border-radius: 4px; }
        .image-item img { width: 50px; height: 50px; object-fit: cover; border-radius: 4px; }
        .delete-btn { background: #dc3545; width: auto; padding: 5px 10px; margin: 0; }
        .delete-btn:hover { background: #c82333; }
    </style>
</head>
<body>

    <div class="admin-container">
        <h2>Admin Control Panel</h2>

        <!-- Image Upload Section -->
        <div class="section">
            <h3>Upload New Image</h3>
            <input type="file" id="imageFile" accept="image/*">
            <button onclick="uploadImage()">Upload Image</button>
        </div>

        <!-- Manage Images -->
        <div class="section">
            <h3>Manage Images</h3>
            <div id="admin-image-list">Loading...</div>
        </div>

        <!-- Ad Configurations Section -->
        <div class="section">
            <h3>Adsterra Configurations</h3>
            <label>Smartlink URL:</label>
            <input type="text" id="smartlink" placeholder="Enter Smartlink URL">

            <label>Banner Ad Code:</label>
            <textarea id="banner" rows="3" placeholder="Paste Banner Script/HTML"></textarea>

            <label>Popunder / Social Bar Script:</label>
            <textarea id="popunder" rows="3" placeholder="Paste Popunder Script"></textarea>

            <button onclick="saveAds()">Save Ad Settings</button>
        </div>
    </div>

    <script>
        async function fetchData() {
            try {
                const res = await fetch('/api/data?' + new Date().getTime()); // Prevent cache
                const data = await res.json();
                
                if (data.ads) {
                    document.getElementById('smartlink').value = data.ads.smartlink || '';
                    document.getElementById('banner').value = data.ads.banner || '';
                    document.getElementById('popunder').value = data.ads.popunder || '';
                }

                const listDiv = document.getElementById('admin-image-list');
                listDiv.innerHTML = '';
                if (data.images && data.images.length > 0) {
                    data.images.forEach((imgUrl, index) => {
                        listDiv.innerHTML += `
                            <div class="image-item">
                                <img src="${imgUrl}" alt="Img">
                                <span>Image ${index + 1}</span>
                                <button class="delete-btn" onclick="deleteImage(${index})">Delete</button>
                            </div>
                        `;
                    });
                } else {
                    listDiv.innerHTML = '<p>No images uploaded yet.</p>';
                }
            } catch (err) {
                console.error('Error fetching data:', err);
            }
        }

        async function uploadImage() {
            const fileInput = document.getElementById('imageFile');
            if (fileInput.files.length === 0) {
                alert('Please select an image first!');
                return;
            }

            const formData = new FormData();
            formData.append('image', fileInput.files[0]);

            const res = await fetch('/api/upload', {
                method: 'POST',
                body: formData
            });

            const result = await res.json();
            if (result.success) {
                alert('Image uploaded successfully!');
                fileInput.value = '';
                fetchData();
            } else {
                alert('Upload failed!');
            }
        }

        async function deleteImage(index) {
            if (!confirm('Are you sure you want to delete this image?')) return;

            const res = await fetch('/api/delete-image', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ index })
            });

            const result = await res.json();
            if (result.success) {
                fetchData();
            } else {
                alert('Delete failed!');
            }
        }

        async function saveAds() {
            const smartlink = document.getElementById('smartlink').value.trim();
            const banner = document.getElementById('banner').value.trim();
            const popunder = document.getElementById('popunder').value.trim();

            const res = await fetch('/api/save-ads', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ smartlink, banner, popunder })
            });

            const result = await res.json();
            if (result.success) {
                alert('Ad settings and Smartlink saved permanently!');
                fetchData();
            } else {
                alert('Failed to save ads!');
            }
        }

        fetchData();
    </script>
</body>
</html>
