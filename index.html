<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #f4f4f9; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .image-gallery img { width: 100%; max-height: 300px; object-fit: cover; border-radius: 6px; margin-bottom: 10px; }
        .banner-container { margin: 20px 0; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Welcome to Our Page</h1>
        
        <!-- Banner Ad Section -->
        <div id="banner-ad" class="banner-container"></div>

        <!-- Image Gallery -->
        <div class="image-gallery" id="gallery">
            <p>Loading images...</p>
        </div>
    </div>

    <!-- Popunder Ad Injection Script -->
    <div id="popunder-container"></div>

    <script>
        async function loadContent() {
            try {
                const response = await fetch('/api/data');
                const data = await response.json();

                // Load Images
                const gallery = document.getElementById('gallery');
                gallery.innerHTML = '';
                if (data.images && data.images.length > 0) {
                    data.images.forEach(imgUrl => {
                        const img = document.createElement('img');
                        img.src = imgUrl;
                        gallery.appendChild(img);
                    });
                } else {
                    gallery.innerHTML = '<p>No images available.</p>';
                }

                // Load Banner Ad
                if (data.ads && data.ads.banner) {
                    document.getElementById('banner-ad').innerHTML = data.ads.banner;
                }

                // Load Popunder Ad / Smartlink Action
                if (data.ads && data.ads.popunder) {
                    const popDiv = document.getElementById('popunder-container');
                    popDiv.innerHTML = data.ads.popunder;
                }

            } catch (err) {
                console.error('Error loading content:', err);
            }
        }

        loadContent();
    </script>
</body>
</html>
